<!DOCTYPE html>

<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGS Sportmasseur – Examensimulatie</title>
<style>
/* ── RESET & BASE ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  min-height: 100vh;
  font-size: 15px;
}

/* ── HEADER ── */
.header {
background: #1e3a5f;
color: #fff;
padding: 14px 16px 10px;
text-align: center;
position: sticky; top: 0; z-index: 20;
box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
.header h1 { font-size: 1.05em; font-weight: 700; letter-spacing: .2px; }
.header .sub { font-size: .72em; opacity: .75; margin-top: 1px; }
.pb-wrap { background: rgba(255,255,255,.2); border-radius: 6px; height: 5px; margin: 9px 0 6px; }
.pb { background: #fbbf24; border-radius: 6px; height: 5px; width: 0; transition: width .4s ease; }
.hstats { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: .7em; }
.hstat { background: rgba(255,255,255,.14); border-radius: 6px; padding: 2px 8px; }

/* ── WRAPPER ── */
.wrap { max-width: 620px; margin: 0 auto; padding: 18px 14px 60px; }

/* ── CARD ── */
.card {
background: #fff;
border-radius: 14px;
padding: 22px 20px;
box-shadow: 0 1px 12px rgba(0,0,0,.07);
}

/* ══════════════════════════════════
START SCREEN
══════════════════════════════════ */
#scStart { display: block; }
.start-title { font-size: 1.2em; font-weight: 700; color: #1e3a5f; margin-bottom: 6px; text-align: center; }
.start-sub { font-size: .83em; color: #64748b; text-align: center; margin-bottom: 20px; line-height: 1.55; }

/* Chapter grid */
.chapters-label {
font-size: .75em; font-weight: 700; color: #1e3a5f;
text-transform: uppercase; letter-spacing: .5px;
margin-bottom: 8px;
display: flex; align-items: center; justify-content: space-between;
}
.sel-all-btn {
font-size: .78em; font-weight: 600; color: #2563ab;
background: none; border: none; cursor: pointer; padding: 0;
text-decoration: underline; text-underline-offset: 2px;
}
.chapters-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 7px;
margin-bottom: 18px;
}
.ch-btn {
display: flex; align-items: center; gap: 8px;
background: #f8fafc;
border: 2px solid #e2e8f0;
border-radius: 10px;
padding: 10px 12px;
cursor: pointer;
transition: all .18s;
text-align: left;
}
.ch-btn:hover { border-color: #93c5fd; background: #eff6ff; }
.ch-btn.on { border-color: #2563ab; background: #eff6ff; }
.ch-check {
width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0;
border: 2px solid #cbd5e1;
display: flex; align-items: center; justify-content: center;
font-size: .75em; color: #fff; transition: all .15s;
}
.ch-btn.on .ch-check { background: #2563ab; border-color: #2563ab; }
.ch-meta { flex: 1; min-width: 0; }
.ch-name { font-size: .82em; font-weight: 600; color: #1e293b; line-height: 1.3; }
.ch-count { font-size: .68em; color: #94a3b8; margin-top: 1px; }

/* Mode buttons */
.mode-label { font-size: .75em; font-weight: 700; color: #1e3a5f; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.modes { display: flex; gap: 8px; margin-bottom: 18px; }
.mbtn {
flex: 1; border: 2px solid #cbd5e1; background: #f8fafc;
border-radius: 10px; padding: 9px 6px; font-size: .8em; font-weight: 600;
cursor: pointer; color: #475569; transition: all .18s; text-align: center; line-height: 1.35;
}
.mbtn:hover { border-color: #2563ab; color: #2563ab; }
.mbtn.on { border-color: #2563ab; background: #2563ab; color: #fff; }

.start-btn {
width: 100%; background: #1e3a5f; color: #fff;
border: none; border-radius: 11px; padding: 13px;
font-size: .95em; font-weight: 700; cursor: pointer; transition: background .2s;
}
.start-btn:hover { background: #2563ab; }
.start-btn:disabled { background: #94a3b8; cursor: not-allowed; }

.warn { font-size: .78em; color: #ef4444; text-align: center; margin-top: 8px; display: none; }

/* ══════════════════════════════════
QUIZ SCREEN
══════════════════════════════════ */
#scQuiz { display: none; }
.q-tag { display: inline-block; background: #dbeafe; color: #1e40af; font-size: .65em; font-weight: 700; padding: 2px 9px; border-radius: 20px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .4px; }
.q-nr { font-size: .72em; color: #94a3b8; margin-bottom: 4px; }
.q-text { font-size: .97em; font-weight: 600; line-height: 1.6; margin-bottom: 16px; color: #0f172a; }
.multi-hint { font-size: .74em; color: #92400e; font-weight: 600; background: #fef3c7; padding: 4px 10px; border-radius: 6px; display: inline-block; margin-bottom: 12px; }

.options { display: flex; flex-direction: column; gap: 8px; }
.opt {
display: flex; align-items: flex-start; gap: 10px;
background: #f8fafc; border: 2px solid #e2e8f0;
border-radius: 10px; padding: 11px 13px;
cursor: pointer; font-size: .88em; line-height: 1.45;
transition: all .16s; width: 100%; text-align: left;
}
.opt:hover:not(:disabled) { border-color: #93c5fd; background: #eff6ff; }
.opt .ltr { font-weight: 800; color: #2563ab; min-width: 16px; flex-shrink: 0; margin-top: 1px; }
.opt.ok { background: #f0fdf4; border-color: #22c55e; }
.opt.ok .ltr { color: #15803d; }
.opt.ko { background: #fff1f2; border-color: #f43f5e; }
.opt.ko .ltr { color: #be123c; }
.opt.sel { background: #eff6ff; border-color: #2563ab; }
.opt:disabled { cursor: default; }

.submit-btn {
display: none; width: 100%; margin-top: 10px;
background: #1e3a5f; color: #fff; border: none;
border-radius: 10px; padding: 11px; font-size: .88em; font-weight: 600; cursor: pointer;
}
.submit-btn:hover { background: #2563ab; }

.feedback {
display: none; margin-top: 12px; padding: 12px 14px;
border-radius: 10px; font-size: .84em; line-height: 1.55;
}
.feedback.ok { background: #f0fdf4; border: 1.5px solid #86efac; color: #14532d; }
.feedback.ko { background: #fff1f2; border: 1.5px solid #fda4af; color: #881337; }
.fb-title { font-weight: 700; margin-bottom: 3px; }
.fb-src { margin-top: 7px; font-size: .76em; opacity: .65; font-style: italic; border-top: 1px solid rgba(0,0,0,.07); padding-top: 5px; }

.next-btn {
display: none; width: 100%; margin-top: 11px;
background: #1e3a5f; color: #fff; border: none;
border-radius: 10px; padding: 12px; font-size: .9em; font-weight: 600; cursor: pointer;
}
.next-btn:hover { background: #2563ab; }

/* ══════════════════════════════════
RESULT SCREEN
══════════════════════════════════ */
#scResult { display: none; text-align: center; }
.r-emoji { font-size: 2.8em; margin: 6px 0; }
.r-pct { font-size: 3.2em; font-weight: 800; color: #1e3a5f; }
.r-label { font-size: .92em; color: #475569; margin: 6px 0 16px; line-height: 1.5; }
.r-chips { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.rchip { padding: 7px 14px; border-radius: 9px; font-weight: 700; font-size: .82em; }
.rchip.g { background: #f0fdf4; color: #15803d; }
.rchip.b { background: #fff1f2; color: #be123c; }

.r-cats { text-align: left; background: #f8fafc; border-radius: 11px; padding: 14px 16px; margin-bottom: 18px; }
.r-cats-title { font-size: .8em; font-weight: 700; color: #1e3a5f; margin-bottom: 10px; }
.crow {
display: flex; align-items: center; gap: 8px;
font-size: .76em; padding: 5px 0;
border-bottom: 1px solid #e2e8f0;
}
.crow:last-child { border-bottom: none; }
.cname { flex: 1; }
.cscore { color: #94a3b8; min-width: 34px; text-align: right; font-size: .9em; }
.cbar { width: 60px; height: 5px; background: #e2e8f0; border-radius: 3px; flex-shrink: 0; overflow: hidden; }
.cfill { height: 100%; border-radius: 3px; }
.cbadge { font-size: .65em; background: #fef3c7; color: #92400e; border-radius: 20px; padding: 1px 6px; font-weight: 700; margin-left: 4px; }

.r-btns { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; }
.rbtn { background: #1e3a5f; color: #fff; border: none; border-radius: 10px; padding: 12px 22px; font-size: .88em; font-weight: 700; cursor: pointer; }
.rbtn.sec { background: #64748b; }
.rbtn:hover { opacity: .85; }
</style>

</head>
<body>

<!-- ── HEADER ── -->

<div class="header">
  <h1>🏅 NGS Sportmasseur – Examensimulatie</h1>
  <div class="sub">Studieboek Nemus Opleidingen</div>
  <div class="pb-wrap"><div class="pb" id="pb"></div></div>
  <div class="hstats">
    <div class="hstat" id="hVoortgang">–</div>
    <div class="hstat" id="hScore">✓ 0</div>
    <div class="hstat" id="hStreak">🔥 0</div>
  </div>
</div>

<div class="wrap"><div class="card">

<!-- ══ START ══ -->

<div id="scStart">
  <div class="start-title">Klaar voor je examen? 💪</div>
  <div class="start-sub">Kies de onderwerpen die je wilt oefenen en hoeveel vragen je wilt maken.</div>

  <div class="chapters-label">
    Onderwerpen
    <button class="sel-all-btn" id="selAllBtn" onclick="toggleAll()">Alles selecteren</button>
  </div>
  <div class="chapters-grid" id="chapGrid">
    <!-- filled by JS -->
  </div>

  <div class="mode-label">Aantal vragen</div>
  <div class="modes">
    <button class="mbtn on" id="m20" onclick="setMode(20)">20<br><span style="font-weight:400;opacity:.8">Snel</span></button>
    <button class="mbtn" id="m40" onclick="setMode(40)">40<br><span style="font-weight:400;opacity:.8">Uitgebreid</span></button>
    <button class="mbtn" id="mMax" onclick="setMode(9999)">Alles<br><span style="font-weight:400;opacity:.8">Volledig</span></button>
  </div>

<button class="start-btn" id="startBtn" onclick="startExam()">Start →</button>

  <div class="warn" id="startWarn">Selecteer minimaal één onderwerp.</div>
</div>

<!-- ══ QUIZ ══ -->

<div id="scQuiz">
  <div class="q-tag" id="qTag"></div>
  <div class="q-nr" id="qNr"></div>
  <div class="q-text" id="qText"></div>
  <div class="multi-hint" id="multiHint" style="display:none">☑ Selecteer ALLE juiste antwoorden, daarna 'Controleer'</div>
  <div class="options" id="opts"></div>
  <button class="submit-btn" id="submitBtn" onclick="submitMulti()">Controleer antwoorden</button>
  <div class="feedback" id="fb">
    <div class="fb-title" id="fbTitle"></div>
    <div id="fbText"></div>
    <div class="fb-src" id="fbSrc"></div>
  </div>
  <button class="next-btn" id="nextBtn" onclick="nextQ()">Volgende →</button>
</div>

<!-- ══ RESULT ══ -->

<div id="scResult">
  <div class="r-emoji" id="rEmoji"></div>
  <div class="r-pct" id="rPct"></div>
  <div class="r-label" id="rLabel"></div>
  <div class="r-chips">
    <div class="rchip g" id="rGoed"></div>
    <div class="rchip b" id="rFout"></div>
  </div>
  <div class="r-cats" id="rCats"></div>
  <div class="r-btns">
    <button class="rbtn" onclick="restart()">🔄 Opnieuw</button>
    <button class="rbtn sec" onclick="goHome()">🏠 Menu</button>
  </div>
</div>

</div></div>

<script>
// ══════════════════════════════════════════════════════════════
// QUESTION DATABASE
// Regels voor gebalanceerde antwoorden:
// - Alle opties hebben dezelfde "diepte" (vergelijkbaar qua lengte/complexiteit)
// - Foute opties zijn plausibele alternatieven, niet willekeurig
// - Bij spier-functievragen: alle opties zijn spier-functie-combinaties
// - Bij definitievragen: alle opties zijn geloofwaardige definities
// type: 'single' (standaard) | 'multi' (meerdere correct)
// a: index correct antwoord (single) | array van indices (multi)
// ══════════════════════════════════════════════════════════════

const CHAPTERS = [
  { id:"botten",   name:"Botten & Geraamte",    icon:"🦴" },
  { id:"gewricht", name:"Gewrichten",            icon:"🔩" },
  { id:"beweging", name:"Bewegingsleer",         icon:"↔️" },
  { id:"spier_arm",name:"Spieren – Arm & Schouder", icon:"💪" },
  { id:"spier_been",name:"Spieren – Been & Heup",icon:"🦵" },
  { id:"spier_romp",name:"Spieren – Romp & Rug", icon:"🏋️" },
  { id:"massage",  name:"Massage & Handgrepen",  icon:"🤲" },
  { id:"contra",   name:"Contra-indicaties",     icon:"🚫" },
  { id:"ehbo",     name:"EHBO & Reanimatie",      icon:"🚑" },
  { id:"blessure", name:"Blessures & Verzorging",icon:"🩹" },
  { id:"tapen",    name:"Tapen & Bandageren",    icon:"🩼" },
  { id:"fysio",    name:"Fysiologie & Training", icon:"❤️" },
  { id:"huid",     name:"Huid & Hygiëne",        icon:"🧴" },
  { id:"dossier",  name:"Cliëntdossier & Regels",icon:"📋" },
];

const DB = [

// ══ BOTTEN & GERAAMTE ══════════════════════════════════════
{ch:"botten", wp:"Hfst. 2 – Geraamte",
q:"Hoeveel botten telt het menselijk skelet bij een volwassene (bij benadering)?",
o:["Ca. 212","Ca. 150","Ca. 300","Ca. 90"], a:0,
src:"Hfst. 2, p. Geraamte",
exp:"Het geraamte bestaat uit meer dan 200 beenderen (ca. 212). Ze geven het lichaam stevigheid, beschermen organen en zijn aanhechtingsplaatsen voor spieren."},

{ch:"botten", wp:"Hfst. 2 – Geraamte",
q:"Een sporter heeft pijn op de buitenzijde van het onderbeen na een val. De arts ziet een breuk in het kuitbeen. Hoe heet dit bot in het Latijn?",
o:["Tibia","Fibula","Femur","Talus"], a:1,
src:"Hfst. 2, p. Been",
exp:"Fibula = kuitbeen (buitenkant onderbeen). Tibia = scheenbeen (binnenkant), femur = dijbeen, talus = sprongbeen."},

{ch:"botten", wp:"Hfst. 2 – Geraamte",
q:"Welk bot verbindt het sternum met het acromion en heeft een S-vormige bouw?",
o:["Scapula","Humerus","Clavicula","Radius"], a:2,
src:"Hfst. 2, p. Schoudergordel",
exp:"De clavicula (sleutelbeen) heeft een S-vorm en draagt het schouderblad naar buiten. Het verbindt het borstbeen met de schouder."},

{ch:"botten", wp:"Hfst. 2 – Wervelkolom",
q:"Hoeveel halswervels (vertebrae cervicales) telt de wervelkolom?",
o:["5","7","12","9"], a:1,
src:"Hfst. 2, p. Wervelkolom",
exp:"7 halswervels (cervicaal, C1-C7), 12 borstwervels (thoracaal), 5 lendenwervels (lumbaal)."},

{ch:"botten", wp:"Hfst. 2 – Geraamte",
q:"Het os sacrum is een massief bot. Uit hoeveel versmolten wervels bestaat het?",
o:["3 wervels","4 wervels","5 wervels","7 wervels"], a:2,
src:"Hfst. 2, p. Wervelkolom",
exp:"Het os sacrum (heiligbeen) bestaat uit 5 versmolten vertebrae sacralis."},

{ch:"botten", wp:"Hfst. 2 – Geraamte",
q:"Een cliënt valt op zijn heup. De masseur kent de anatomie van het heupbeen. Welke drie botten vormen samen het os coxa?",
o:["Femur, tibia en fibula","Ilium, pubis en ischium","Sacrum, coccygis en ilium","Femur, patella en tibia"], a:1,
src:"Hfst. 2, p. Bekkengordel",
exp:"Os coxa = os ilium (darmbeen) + os pubis (schaambeen) + os ischium (zitbeen). Bij volwassenen zijn deze drie vergroeid tot één bot."},

{ch:"botten", wp:"Hfst. 2 – Geraamte",
q:"Hoeveel paar ribben (costae) heeft de mens?",
o:["10 paar","12 paar","14 paar","8 paar"], a:1,
src:"Hfst. 2, p. Costae",
exp:"12 paar: 7 ware ribben (direct aan sternum), 3 valse ribben (ribbenbogen) en 2 zwevende ribben."},

{ch:"botten", wp:"Hfst. 2 – Geraamte",
q:"De mandibula is het enige beweeglijke schedelbot. Wat is de mandibula?",
o:["Wandbeen","Jukbeen","Bovenkaak","Onderkaak"], a:3,
src:"Hfst. 2, p. Hoofd",
exp:"Mandibula = onderkaak. De bovenkaak heet maxilla. Alle andere schedelbotten zijn met naden (suturae) onbeweeglijk verbonden."},

{ch:"botten", wp:"Hfst. 4 – Femur",
q:"Een sportmasseur tast de achterzijde van het dijbeen (femur) af. Welke benige ruwheid vindt hij hier?",
o:["Tuberositas tibiae","Linea aspera","Trochanter minor","Condylus lateralis"], a:1,
src:"Hfst. 4, p. Femur",
exp:"De linea aspera is een ruwe lijn op de achterzijde van het femur waaraan diverse spieren (o.a. adductoren) hechten."},

{ch:"botten", wp:"Hfst. 2 – Geraamte",
q:"Wat is scoliose?",
o:["Overmatige achterwaartse bolling (kyfose)","Overmatige voorwaartse holling (lordose)","Abnormale zijwaartse afwijking van de wervelkolom","Wervelbreuk door overbelasting"], a:2,
src:"Hfst. 2, p. Wervelkolom",
exp:"Scoliose = abnormale kromming in het frontale vlak (zijwaarts). Lordose/kyfose zijn krommingen in het sagittale vlak."},

{ch:"botten", wp:"Hfst. 4 – Voet",
q:"De voet bestaat uit voetwortelbeentjes (tarsalia), middenvoetsbeentjes en teenkootjes. Hoeveel tarsalia zijn er?",
o:["5","6","7","8"], a:2,
src:"Hfst. 4, p. Voet",
exp:"7 voetwortelbeentjes (tarsalia), 5 middenvoetsbeentjes (metatarsalia), 14 teenkootjes (falangen)."},

{ch:"botten", wp:"Hfst. 2 – Halswervels",
q:"De atlas draagt het hoofd. Welke unieke eigenschap heeft de draaier (axis, C2) waardoor hoofdrotatie mogelijk is?",
o:["Hij heeft een tandvormig uitsteeksel (dens) waaromheen de atlas draait","Hij is de grootste halswervel","Hij heeft de meeste ribverbindingen","Hij beschermt de halsslagader"], a:0,
src:"Hfst. 2, p. Halswervels",
exp:"De draaier (axis) heeft een dens (tand) waaromheen de atlas roteert. Dit maakt draaien van het hoofd (rotatie) mogelijk."},

{ch:"botten", wp:"Hfst. 2 – Geraamte",
q:"Welk type been is het schouderblad (scapula)?",
o:["Pijpbeen","Plat been","Kort onregelmatig been","Sesambeen"], a:1,
src:"Hfst. 2, p. Soorten beenderen",
exp:"De scapula is een plat been. Platte beenderen zijn breed en plat (ook: schedel, rib, borstbeen). Pijpbeenderen zijn lang (femur, tibia)."},

// ══ GEWRICHTEN ═════════════════════════════════════════════
{ch:"gewricht", wp:"Hfst. 1 – Gewrichten",
q:"Een sportmasseur onderzoekt het schoudergewricht. Welk type gewricht is het art. humeri?",
o:["Scharniergewricht (1-assig)","Zadelgewricht (2-assig)","Kogelgewricht (3-assig)","Rolgewricht (1-assig)"], a:2,
src:"Hfst. 1, p. Typen gewrichten",
exp:"Het schoudergewricht is een kogelgewricht: 3-assig, 3 graden van vrijheid. Kogel in een kom = grote bewegingsvrijheid."},

{ch:"gewricht", wp:"Hfst. 1 – Gewrichten",
q:"Het kniegewricht is het grootste gewricht van het lichaam. Welk type is het?",
o:["Kogelgewricht (3-assig)","Scharniergewricht (1-assig)","Zadelgewricht (2-assig)","Vlakgewricht (nagenoeg onbeweeglijk)"], a:1,
src:"Hfst. 1, p. Typen gewrichten",
exp:"Het kniegewricht is een scharniergewricht: 1-assig (buigen en strekken). Beperkte rotatie is in gebogen stand ook mogelijk."},

{ch:"gewricht", wp:"Hfst. 4 – Kniegewricht",
q:"De knie heeft speciale structuren die schokken dempen en de gewrichtsvlakken beter op elkaar laten aansluiten. Wat zijn deze?",
o:["Kruisbanden","Collaterale ligamenten","Menisci","Bursae"], a:2,
src:"Hfst. 4, p. Kniegewricht",
exp:"Menisci (halvemaanvormige kraakbeentjes) dempen schokken, absorberen energie en zorgen voor aanpassing tussen de gewrichtsvlakken van femur en tibia."},

{ch:"gewricht", wp:"Hfst. 1 – Gewrichten",
q:"Welke vloeistof wordt door de synoviale membraan (binnenste kapsellaag) afgescheiden?",
o:["Lymfevloeistof","Synovia (gewrichtssmeer)","Secreet van de talgklieren","Interstitieel vocht"], a:1,
src:"Hfst. 1, p. Diarthrosen",
exp:"Synovia = gewrichtssmeer. Wordt afgescheiden door de synoviale membraan. Smeert het gewricht en voedt het kraakbeen."},

{ch:"gewricht", wp:"Hfst. 4 – Spronggewricht",
q:"Het bovenste spronggewricht (art. talo-cruralis) maakt welke bewegingen mogelijk?",
o:["Inversie en eversie","Pronatie en supinatie van de voet","Plantairflexie en dorsaalflexie","Abductie en adductie"], a:2,
src:"Hfst. 4, p. Bovenste spronggewricht",
exp:"Het bovenste spronggewricht is een scharniergewricht. Bewegingen: plantairflexie (voet omlaag) en dorsaalflexie (voet omhoog)."},

{ch:"gewricht", wp:"Hfst. 1 – Gewrichten",
q:"Welke structuren houden de boteinden in een gewricht op hun plaats? (meerdere antwoorden)",
o:["Gewrichtskapsel","Spierdruk","Vetweefsel rondom gewricht","Luchtdruk"],
type:"multi", a:[0,1,3],
src:"Hfst. 1, p. Gewricht",
exp:"De boteinden worden op hun plaats gehouden door: het gewrichtskapsel, de gewrichtsbanden, de spierdruk én de luchtdruk."},

{ch:"gewricht", wp:"Hfst. 4 – Kniegewricht",
q:"Een sporter heeft een voorste kruisbandletsel. Wat is de functie van de kruisbanden?",
o:["Schokdemping in de knie","Stabilisatie: voorkomen voor-achterwaartse verschuiving van tibia t.o.v. femur","Smeermiddel voor het kraakbeen","Verbinding tussen knieschijf en tibia"], a:1,
src:"Hfst. 4, p. Kniegewricht",
exp:"Kruisbanden stabiliseren de knie door voor-achterwaartse verschuiving van de tibia t.o.v. het femur te beperken. De voorste kruisband is de meest geblesseerde."},

// ══ BEWEGINGSLEER ═══════════════════════════════════════════
{ch:"beweging", wp:"Hfst. 1 – Bewegingsleer",
q:"Een trainer instrueert: 'Voer abductie van de arm uit.' Wat doet de sporter?",
o:["Arm naar voren heffen","Arm zijwaarts van het lichaam afvoeren","Arm naar het lichaam aanvoeren","Arm naar achteren strekken"], a:1,
src:"Hfst. 1, p. Bewegingsrichtingen",
exp:"Abductie = van de mediaanlijn af bewegen. Adductie = naar de mediaanlijn toe."},

{ch:"beweging", wp:"Hfst. 1 – Bewegingsleer",
q:"Bij pronatie van de onderarm:",
o:["Handpalm draait naar boven (omhoog)","Handrug draait naar boven (naar binnen)","Elleboog buigt in het gewricht","Pols buigt in dorsaalflexie"], a:1,
src:"Hfst. 1, p. Pronatie/Supinatie",
exp:"Pronatie = hand naar binnen draaien, handrug omhoog. Supinatie = handpalm omhoog (geheugensteuntje: 'soep eten')."},

{ch:"beweging", wp:"Hfst. 1 – Bewegingsleer",
q:"Een cliënt heeft een hoofd dat ver naar voren staat op de nek. Hoe noem je deze stand?",
o:["Retroflexie van de cervicale wervelkolom","Kyfose van de cervicale wervelkolom","Anteflexie/protrusie van de cervicale wervelkolom","Lateraalflexie van de cervicale wervelkolom"], a:2,
src:"Hfst. 1, p. Richtingen",
exp:"Hoofd ver naar voren = anteflexie of protrusie van de cervicale wervelkolom. Een veelvoorkomende houdingsfout ('tekststijf-nek')."},

{ch:"beweging", wp:"Hfst. 1 – Bewegingsleer",
q:"Een sporter steekt zijn schouderbladen naar voren (bv. bij een strekbeweging). Hoe heet dit?",
o:["Retractie van de scapulae","Elevatie van de scapulae","Protractie van de scapulae","Depressie van de scapulae"], a:2,
src:"Hfst. 1 / Hfst. 5",
exp:"Protractie = schouderbladen van de wervelkolom af bewegen (naar voren). Retractie = naar de wervelkolom toe (naar achteren)."},

{ch:"beweging", wp:"Hfst. 4 – Voetbewegingen",
q:"Eversie van de voet is een combinatie van welke drie bewegingen?",
o:["Plantairflexie + adductie + supinatie","Dorsaalflexie + adductie + supinatie","Plantairflexie + abductie + pronatie","Dorsaalflexie + abductie + pronatie"], a:3,
src:"Hfst. 4, p. Onderste spronggewricht",
exp:"Eversie = dorsaalflexie + abductie + pronatie. Het tegenovergestelde is inversie = plantairflexie + adductie + supinatie."},

{ch:"beweging", wp:"Hfst. 1 – Bewegingsleer",
q:"Abductie en adductie van de arm vinden plaats om welke as?",
o:["Longitudinale as (boven-onder)","Transversale as (links-rechts)","Sagittale as (voor-achter)","Frontale as (zijwaarts)"], a:2,
src:"Hfst. 1, p. Assen",
exp:"Sagittale as (voor-achterwaarts): abductie/adductie. Transversale as: anteflexie/retroflexie. Longitudinale as: rotatie."},

{ch:"beweging", wp:"Hfst. 1 – Bewegingsleer",
q:"Wat is endorotatie?",
o:["Buitenwaarts draaien van een botstuk om de lengte-as","Binnenwaarts draaien van een botstuk om de lengte-as","Zijwaarts buigen van de wervelkolom","Naar voren buigen van de romp"], a:1,
src:"Hfst. 1, p. Bewegingsrichtingen",
exp:"Endorotatie = binnenwaarts draaien. Exorotatie = buitenwaarts draaien. Beide om de longitudinale as van het betreffende botstuk."},

{ch:"beweging", wp:"Hfst. 1 – Bewegingsleer",
q:"Bij de hand maken we onderscheid tussen palmairflexie en dorsaalflexie. Wat is palmairflexie?",
o:["Hand in richting handrug buigen","Hand in richting handpalm buigen","Hand naar radiale zijde buigen","Hand naar ulnaire zijde buigen"], a:1,
src:"Hfst. 1, p. Bewegingen hand",
exp:"Palmairflexie = hand in richting handpalm buigen (naar beneden). Dorsaalflexie = hand in richting handrug buigen (naar boven)."},

// ══ SPIEREN – ARM & SCHOUDER ════════════════════════════════
{ch:"spier_arm", wp:"Hfst. 5 – Spieren arm",
q:"Een cliënt heeft moeite met buigen van de elleboog. Welke spier is de primaire buiger?",
o:["M. triceps brachii","M. deltoideus pars spinalis","M. biceps brachii","M. infraspinatus"], a:2,
src:"Hfst. 5, p. m. biceps brachii",
exp:"M. biceps brachii = flexie (buigen) van de onderarm én supinatie. De m. brachialis is de tweede buiger, m. brachioradialis de derde."},

{ch:"spier_arm", wp:"Hfst. 5 – Spieren arm",
q:"De m. triceps brachii heeft drie koppen. Wat is de functie?",
o:["Flexie en supinatie van de onderarm","Extensie van de onderarm + adductie arm (caput longum)","Flexie van de schouder + abductie arm","Exorotatie schouder + abductie arm"], a:1,
src:"Hfst. 5, p. m. triceps brachii",
exp:"M. triceps brachii: strekken van de onderarm (extensie). Het caput longum geeft ook adductie en retroversie van de arm."},

{ch:"spier_arm", wp:"Hfst. 5 – Spieren arm",
q:"De m. latissimus dorsi is de grootste spier. Welke bewegingen voert hij uit?",
o:["Abductie + exorotatie + anteflexie arm","Adductie + endorotatie + retroflexie arm","Abductie + exorotatie + retroflexie arm","Adductie + exorotatie + anteflexie arm"], a:1,
src:"Hfst. 5, p. m. latissimus dorsi",
exp:"M. latissimus dorsi: adductie + endorotatie + retroflexie arm. Trekt de arm omlaag en naar achteren."},

{ch:"spier_arm", wp:"Hfst. 5 – Spieren arm",
q:"De m. deltoideus heeft drie delen. Welk deel voert hoofdzakelijk abductie van de arm uit?",
o:["Pars clavicularis (voorste deel)","Pars acromialis (middendeel)","Pars spinalis (achterste deel)","Alle drie delen gelijkwaardig"], a:1,
src:"Hfst. 5, p. m. deltoideus",
exp:"M. deltoideus pars acromialis (middendeel) is de hoofdbeweger bij abductie. Pars clavicularis = anteversie. Pars spinalis = retroversie."},

{ch:"spier_arm", wp:"Hfst. 3 – Rotatormanchet",
q:"De rotatormanchet stabiliseert het schoudergewricht. Welke vier spieren vormen de rotatormanchet?",
o:["Biceps, triceps, deltoideus, coracobrachialis","Subscapularis, supraspinatus, infraspinatus, teres minor","Pectoralis major, latissimus dorsi, teres major, deltoideus","Trapezius, rhomboideus, levator scapulae, serratus anterior"], a:1,
src:"Hfst. 3, p. Schoudergewricht",
exp:"Rotatormanchet: m. subscapularis (endorotatie), m. supraspinatus (abductie), m. infraspinatus (exorotatie), m. teres minor (exorotatie)."},

{ch:"spier_arm", wp:"Hfst. 5 – Spieren arm",
q:"Een sporter kan zijn arm niet naar buiten draaien. Welke spier voert exorotatie van de schouder uit?",
o:["M. subscapularis","M. teres major","M. infraspinatus","M. pectoralis major"], a:2,
src:"Hfst. 5, p. m. infraspinatus",
exp:"M. infraspinatus (ondergraatsspier) = exorotatie. M. subscapularis en m. teres major doen juist endorotatie."},

{ch:"spier_arm", wp:"Hfst. 5 – Spieren arm",
q:"De m. pectoralis major heeft drie delen. Welke beweging voert hij NIET uit?",
o:["Adductie van de arm","Endorotatie van de arm","Abductie van de arm","Anteflexie van de afgevoerde arm"], a:2,
src:"Hfst. 5, p. m. pectoralis major",
exp:"M. pectoralis major: adductie, endorotatie en anteflexie. NIET abductie — dat doet de m. deltoideus."},

{ch:"spier_arm", wp:"Hfst. 5 – Spieren arm",
q:"De m. trapezius pars descendens (bovenste deel) voert welke bewegingen uit?",
o:["Depressie schouderblad + endorotatie schouderblad + neksflexie","Elevatie schouderblad + exorotatie schouderblad + nekextensie","Protractie schouderblad + depressie + lateraalflexie nek","Retractie schouderblad + elevatie + neksflexie"], a:1,
src:"Hfst. 5, p. m. trapezius",
exp:"M. trapezius pars descendens: elevatie schouderblad + exorotatie schouderblad + extensie (strekken) van de nek."},

{ch:"spier_arm", wp:"Hfst. 5 – Spieren arm",
q:"De m. serratus anterior wordt ook wel de 'boksspier' genoemd. Wat is de functie?",
o:["Retractie schouderblad + elevatie","Protractie schouderblad + tegen borstkas drukken scapula","Elevatie schouderblad + exorotatie","Adductie arm + depressie schouderblad"], a:1,
src:"Hfst. 5, p. m. serratus anterior",
exp:"M. serratus anterior: protractie (naar voren trekken) van het schouderblad + houdt scapula tegen de borstkas. Tevens hulpademhalingsspier."},

{ch:"spier_arm", wp:"Hfst. 5 – Spieren arm",
q:"Welke bewegingen maakt de m. trapezius pars transversus + pars ascendens? (meerdere antwoorden)",
o:["Retractie (adductie) schouderblad","Elevatie schouderblad","Depressie schouderblad","Opheffen van de arm boven 90°"], type:"multi", a:[0,2],
src:"Hfst. 5, p. m. trapezius",
exp:"Pars transversus = retractie schouderblad. Pars ascendens = depressie + retractie schouderblad. Pars descendens = elevatie."},

{ch:"spier_arm", wp:"Hfst. 5 – Spieren arm",
q:"De m. biceps brachii heeft twee koppen. Waar ontspringt de caput longum?",
o:["Processus coracoideus scapulae","Tuberculum supraglenoidale scapulae","Epicondylus medialis humeri","Acromion"], a:1,
src:"Hfst. 5, p. m. biceps brachii",
exp:"Caput longum: tuberculum supraglenoidale (boven het gewrichtsoppervlak van de scapula). Caput breve: processus coracoideus."},

// ══ SPIEREN – BEEN & HEUP ═══════════════════════════════════
{ch:"spier_been", wp:"Hfst. 5 – Spieren been",
q:"Een sporter heeft een hamstringblessure. Welke drie spieren vormen de hamstrings?",
o:["Rectus femoris, vastus lateralis, vastus medialis","Biceps femoris, semitendinosus, semimembranosus","Gluteus maximus, biceps femoris, gastrocnemius","Gracilis, sartorius, adductor longus"], a:1,
src:"Hfst. 5, p. Hamstrings",
exp:"Hamstrings: m. biceps femoris + m. semitendinosus + m. semimembranosus. Functie: knieflexie + heupextensie (retroversie)."},

{ch:"spier_been", wp:"Hfst. 5 – Spieren been",
q:"De m. quadriceps femoris heeft 4 hoofden. Welk hoofd buigt TEVENS in de heup (naast knie-extensie)?",
o:["M. vastus lateralis","M. vastus medialis","M. vastus intermedius","M. rectus femoris"], a:3,
src:"Hfst. 5, p. m. quadriceps femoris",
exp:"M. rectus femoris ontspringt aan het darmbeen → voert ook heupflexie (anteversie) uit. De andere drie vastus-spieren strekken alleen de knie."},

{ch:"spier_been", wp:"Hfst. 5 – Spieren been",
q:"Een cliënt heeft moeite met traplopen en opstaan uit een stoel. Welke spier is primair verantwoordelijk voor extensie van de heup?",
o:["M. iliopsoas","M. sartorius","M. gracilis","M. gluteus maximus"], a:3,
src:"Hfst. 5, p. m. gluteus maximus",
exp:"M. gluteus maximus: de krachtigste extensor van de heup. Actief bij traplopen, oprichten uit gebogen houding en rennen."},

{ch:"spier_been", wp:"Hfst. 5 – Spieren been",
q:"Een atleet stretcht zijn soleus met een gebogen knie. Waarom is de knie GEBOGEN bij de soleus-rek?",
o:["Omdat de m. soleus krachtiger is dan de m. gastrocnemius","Omdat de m. soleus het kniegewricht NIET kruist en zo specifiek gerekt wordt","Omdat de kniepees ontspannen moet zijn","Omdat dorsaalflexie alleen bij gebogen knie kan"], a:1,
src:"Hfst. 5, p. m. soleus",
exp:"De m. soleus kruist het kniegewricht niet. Bij gebogen knie is de m. gastrocnemius (die wél het knie kruist) ontspannen, zodat je de soleus specifiek rekt."},

{ch:"spier_been", wp:"Hfst. 5 – Spieren been",
q:"De m. tibialis anterior voert dorsaalflexie uit. Welke spieren zijn de directe antagonisten?",
o:["M. peroneus longus + m. tibialis posterior","M. gastrocnemius + m. soleus (m. triceps surae)","M. extensor digitorum longus + m. extensor hallucis","M. flexor digitorum longus + m. flexor hallucis"], a:1,
src:"Hfst. 5, p. m. tibialis anterior",
exp:"M. tibialis anterior = dorsaalflexie. Antagonisten zijn de plantairflexoren: m. gastrocnemius + m. soleus (m. triceps surae)."},

{ch:"spier_been", wp:"Hfst. 5 – Spieren been",
q:"De m. iliopsoas bestaat uit m. iliacus en m. psoas major. Wat is de functie bij een gefixeerde romp?",
o:["Extensie heup + endorotatie dijbeen","Heupflexie (anteversie) + exorotatie dijbeen","Adductie dijbeen + knieflexie","Abductie dijbeen + endorotatie"], a:1,
src:"Hfst. 5, p. m. iliopsoas",
exp:"M. iliopsoas bij gefixeerde romp: heffen dijbeen (anteversie/heupflexie) + exorotatie dijbeen. Bij gefixeerd been: rompflexie."},

{ch:"spier_been", wp:"Hfst. 5 – Spieren been",
q:"M. gluteus medius en minimus zijn de voornaamste abductoren. Welke bijkomende functie hebben ze?",
o:["Knie-extensie stabiliseren","Bekken stabiliseren bij éénbeensstaan (voorkomen Trendelenburg)","Heupextensie bij traplopen","Plantairflexie bij het afzetten"], a:1,
src:"Hfst. 5, p. m. gluteus medius / minimus",
exp:"M. gluteus medius en minimus stabiliseren het bekken bij éénbeensstaan. Uitval geeft het Trendelenburg-teken: bekken zakt aan de niet-gesteunde zijde."},

{ch:"spier_been", wp:"Hfst. 5 – Spieren been",
q:"Welke twee spieren vormen samen de m. triceps surae?",
o:["M. tibialis anterior + m. peroneus longus","M. gastrocnemius + m. soleus","M. biceps femoris + m. semimembranosus","M. flexor hallucis + m. flexor digitorum"], a:1,
src:"Hfst. 5, p. m. triceps surae",
exp:"M. triceps surae = m. gastrocnemius + m. soleus. Ze hechten samen via de achillespees aan het hielbeen (tuber calcanei)."},

{ch:"spier_been", wp:"Hfst. 5 – Spieren been",
q:"De m. sartorius voert meerdere bewegingen uit. Welke combinatie is correct?",
o:["Knieextensie + heupextensie + endorotatie dijbeen","Knieflexie + heupflexie + exorotatie dijbeen + endorotatie onderbeen","Adductie dijbeen + knieflexie + plantairflexie","Abductie dijbeen + knieextensie + dorsaalflexie"], a:1,
src:"Hfst. 5, p. m. sartorius",
exp:"M. sartorius: knieflexie + endorotatie onderbeen + exorotatie dijbeen + heupflexie. Dit resulteert in de typische 'kleermakerszit'."},

{ch:"spier_been", wp:"Hfst. 5 – Spieren been",
q:"Welke spiergroep is verantwoordelijk voor adductie van het dijbeen?",
o:["Hamstrings (biceps femoris, semitendinosus, semimembranosus)","Adductoren (adductor longus, brevis, magnus, gracilis, pectineus)","Quadriceps (rectus femoris, vastus lateralis, medialis, intermedius)","Glutealen (gluteus maximus, medius, minimus)"], a:1,
src:"Hfst. 5, p. Adductoren",
exp:"De adductoren (m. adductor longus/brevis/magnus, m. gracilis, m. pectineus) bewegen het been naar de middenlijn."},

{ch:"spier_been", wp:"Hfst. 5 – Spieren been",
q:"Twee kuitspieren die samen plantairflexie uitvoeren: welke zijn dat? (meerdere antwoorden)",
o:["M. gastrocnemius","M. soleus","M. tibialis anterior","M. extensor digitorum longus"],
type:"multi", a:[0,1],
src:"Hfst. 5, p. m. triceps surae",
exp:"M. gastrocnemius + m. soleus = m. triceps surae, de voornaamste plantairflexoren. M. tibialis anterior en extensor digitorum longus doen juist dorsaalflexie."},

// ══ SPIEREN – ROMP & RUG ════════════════════════════════════
{ch:"spier_romp", wp:"Hfst. 5 – Spieren romp",
q:"Welke spier is de BELANGRIJKSTE ademhalingsspier?",
o:["M. intercostalis externus","M. rectus abdominis","Diafragma (middenrif)","M. scaleni"], a:2,
src:"Hfst. 5, p. Diafragma",
exp:"Diafragma = de belangrijkste ademhalingsspier. Bij inademing daalt het diafragma, de borstholte vergroot en lucht stroomt in."},

{ch:"spier_romp", wp:"Hfst. 5 – Spieren romp",
q:"Een sporter heeft rugpijn bij het rechtop staan. Welke spier houdt de wervelkolom in stand en strekt de rug?",
o:["M. obliquus externus abdominis","M. rectus abdominis","M. erector spinae","M. transversus abdominis"], a:2,
src:"Hfst. 5, p. m. erector spinae",
exp:"M. erector spinae (lange rugstrekkers): houdt wervelkolom in stand + retroflexie (strekken rug) bilateraal. Unilateraal: lateraalflexie."},

{ch:"spier_romp", wp:"Hfst. 5 – Spieren romp",
q:"Welke spier is de voornaamste buiger van de romp (anteflexie)?",
o:["M. erector spinae","M. quadratus lumborum","M. rectus abdominis","M. iliocostalis"], a:2,
src:"Hfst. 5, p. m. rectus abdominis",
exp:"M. rectus abdominis = rechte buikspier, de voornaamste buiger van de romp bij bilaterale contractie."},

{ch:"spier_romp", wp:"Hfst. 5 – Spieren romp",
q:"De m. latissimus dorsi ontspringt aan een groot gebied. Wat is zijn origo?",
o:["Processus coracoideus + acromion","Doornuitsteeksels 7e-12e borstwervel + fascia thoracolumbalis + crista iliaca","Angulus inferior scapula + 6e-9e rib","Trochantor major + linea aspera femur"], a:1,
src:"Hfst. 5, p. m. latissimus dorsi",
exp:"M. latissimus dorsi ontspringt aan: doornuitsteeksels 7e-12e borstwervel, 9e-12e rib, fascia thoracolumbalis én de crista iliaca."},

{ch:"spier_romp", wp:"Hfst. 5 – Spieren romp",
q:"Welke spieren zijn verantwoordelijk voor rotatie van de romp? (meerdere antwoorden)",
o:["M. obliquus externus abdominis","M. obliquus internus abdominis","M. rectus abdominis","M. transversus abdominis"],
type:"multi", a:[0,1],
src:"Hfst. 5, p. Rotatie romp",
exp:"Rotatie romp: m. obliquus externus (draait naar contralaterale zijde) + m. obliquus internus (draait naar homolaterale zijde). Rectus en transversus doen geen rotatie."},

// ══ MASSAGE & HANDGREPEN ════════════════════════════════════
{ch:"massage", wp:"Hfst. 43 – Theorie Massage",
q:"Welke vijf klassieke massagehandgrepen worden door de hele massagegeschiedenis herkend?",
o:["Effleurage, pétrissage, frictie, vibratie, tapotage","Strijken, kneden, taping, rekken, schudden","Druk, wrijving, trilling, klop, strijk","Oppervlakkig, diep, circulair, lineair, kruislings"], a:0,
src:"Hfst. 43, p. Massage handgrepen",
exp:"De 5 klassieke handgrepen (Franse namen): effleurage (strijking), pétrissage (kneding), frictie (wrijving), vibratie (trilling), tapotage (klopping)."},

{ch:"massage", wp:"Hfst. 43 – Theorie Massage",
q:"Een cliënt vraagt een ontspannende massage na een wedstrijd. Met welke handgreep sluit je de sederende massage af?",
o:["Diep pétrissage op de rugspieren","Tapotement (klopping) op de rug","Schuddingen gevolgd door slot-effleurage","Fricties op alle myogelosen"], a:2,
src:"Hfst. 43, p. Sederende massage",
exp:"Sederende massage (ontspanning) afsluiten met schuddingen + slot-effleurage. Tapotement hoort bij de activerende/stimulerende massage."},

{ch:"massage", wp:"Hfst. 43 – Theorie Massage",
q:"Na een massage ziet de huid rood en voelt warm aan. Hoe heet dit effect?",
o:["Oedeem door verhoogde hydrostatische druk","Hyperemie door verbeterde arteriële en capillaire doorbloeding","Cyanose door zuurstoftekort","Urticaria door allergische reactie"], a:1,
src:"Hfst. 43, p. Dr. Kirchberg",
exp:"Hyperemie = verbeterde bloedtoevoer (roodheid + warmte). Dr. Kirchberg: massage verbetert niet alleen veneuze, maar ook arteriële en capillaire circulatie."},

{ch:"massage", wp:"Hfst. 43 – Theorie Massage",
q:"Bij palpatie voelt een masseur ronde, harde knobbeltjes in de spier. Hoe worden deze lokale verhardingen genoemd?",
o:["Callusverhardingen","Myogelosen (spierverhardingen)","Osteofyten (botuitsteeksels)","Lipomen (vetknobbels)"], a:1,
src:"Hfst. 43, p. Myogelosen",
exp:"Myogelosen = lokale bolvormige spierverhardingen door zuurstoftekort en ophoping van afvalstoffen in de spiercel. Beschreven door Dr. Muller (1915)."},

{ch:"massage", wp:"Hfst. 43 – Massageprogramma",
q:"Bij een beenmassage (achterzijde) masseer je van proximaal naar distaal. Wat is de juiste volgorde?",
o:["Voet → onderbeen → hamstrings → bil","Onderbeen → knie → hamstrings → bil","Bil → hamstrings → onderbeen → voet","Knie → hamstrings → bil → voet"], a:2,
src:"Hfst. 43, p. Massageprogramma been",
exp:"Van proximaal naar distaal: bil → hamstrings → onderbeen → voet. Je werkt altijd van het centrum naar de periferie."},

{ch:"massage", wp:"Hfst. 43 – Massage",
q:"Een cliënt wordt duizelig direct na het opstaan van de massagetafel. Wat adviseer je?",
o:["Meteen 112 bellen en niet bewegen","Rustig blijven liggen, langzaam opstaan, niet direct autorijden","Koud water drinken en door bewegen","Warm inpakken en 30 minuten rusten"], a:1,
src:"Hfst. 43, p. Reacties na massage",
exp:"Duizeligheid na massage = orthostatische hypotensie (bloeddrukdaling door diepe ontspanning). Rustig liggen, langzaam opstaan, niet rijden."},

{ch:"massage", wp:"Hfst. 43 – Anamnese",
q:"De anamnese vóór een massage bestaat uit vier onderdelen. Welke zijn dat?",
o:["Naam, klacht, sport, behandelplan","Sociale, gezondheids-, sport- en blessureanamnese","Inspectie, palpatie, diagnose, behandeling","Intakegesprek, meting, vragenlijst, rapportage"], a:1,
src:"Hfst. 43, p. Anamnese",
exp:"Anamnese: (a) sociale anamnese, (b) gezondheidsanamnese, (c) sportanamnese, (d) blessureanamnese."},

{ch:"massage", wp:"Hfst. 43 – Massage",
q:"Een massage kan meerdere doelen hebben. Welke doelen zijn correct? (meerdere antwoorden)",
o:["Stimulerend (doorbloeding verbeteren vóór belasting)","Ontspannend (algehele ontspanning ná belasting)","Pijnverminderend (analgetisch)","Botversteviging"], type:"multi", a:[0,1,2],
src:"Hfst. 43, p. Indicaties massage",
exp:"Massage kan: stimulerend, ontspannend en pijnverminderend (analgetisch) werken. Ook: dehydratie (ontwaterend) en desquamatie (ontschilfering huid). Botversteviging is geen massagedoel."},

// ══ CONTRA-INDICATIES ═══════════════════════════════════════
{ch:"contra", wp:"Hfst. 43 – Contra-indicaties",
q:"Een sporter meldt zich met koorts van 38,8°C voor een massage. Wat doe je?",
o:["Lichte effleurage is toegestaan","Massage alleen op de benen uitvoeren","Niet masseren: koorts is een absolute contra-indicatie","Eerst vragen of de sporter pijnstillers heeft genomen"], a:2,
src:"Hfst. 43, p. Absolute contra-indicaties",
exp:"Koorts = absolute contra-indicatie. De stofwisseling is al verhoogd; massage mag niet worden gegeven."},

{ch:"contra", wp:"Hfst. 43 – Contra-indicaties",
q:"Een cliënt heeft een verstuikte enkel (enkeldistorsie). Hoe handel je als masseur?",
o:["Niet behandelen: absolute contra-indicatie voor het hele lichaam","Enkel en voet NIET masseren; rest van het lichaam wel (relatieve plaatselijke)","Voorzichtig de enkel masseren voor doorbloeding","Tapen en vervolgens de enkel masseren"], a:1,
src:"Hfst. 43, p. Relatieve plaatselijke contra-indicaties",
exp:"Enkeldistorsie = relatieve plaatselijke contra-indicatie. Enkel + voet: NIET masseren. Rest van het lichaam: WEL."},

{ch:"contra", wp:"Hfst. 43 – Contra-indicaties",
q:"Hypertonie van een spier betekent:",
o:["Verlaagde spierspanning (slap, zwak)","Verhoogde spierspanning (stijf, verkrampt)","Ontstoken spierbindweefsel","Verzwakte spierdoorbloeding"], a:1,
src:"Hfst. 43, p. Dr. Muller",
exp:"Hypertonie = verhoogde spierspanning (te stijf/verkrampt). Hypotonie = verlaagde spierspanning (te slap). Begrip van Dr. Muller (1915)."},

{ch:"contra", wp:"Hfst. 43 – Contra-indicaties",
q:"Een cliënt heeft oedeem (vochtophoping) in het onderbeen. Wat is de aanbevolen aanpak?",
o:["Diep masseren voor lymfatische drainage","Geen massage; eventueel manuele lymfedrainage (MLD)","Tape aanbrengen over het oedeem","Warm compres op het oedeem"], a:1,
src:"Hfst. 43, p. Contra-indicaties",
exp:"Bij oedeem: NIET masseren. Aanbevolen alternatief: manuele lymfedrainage (MLD)."},

{ch:"contra", wp:"Hfst. 43 – Contra-indicaties",
q:"Welke situaties zijn absolute contra-indicaties voor massage? (meerdere antwoorden)",
o:["Koorts","Algemene infectieziekte (griep, keelontsteking)","Spierpijn na een zware training","Extreme vermoeidheid / uitputting na grote prestaties"],
type:"multi", a:[0,1,3],
src:"Hfst. 43, p. Absolute contra-indicaties",
exp:"Absolute contra-indicaties: koorts, infectieziekten, extreme vermoeidheid/uitputting, pathologie van interne/neurologische/traumatische aard. Spierpijn na training is GEEN absolute contra-indicatie."},

{ch:"contra", wp:"Hfst. 43 – Contra-indicaties",
q:"Een cliënt heeft spataderen op het onderbeen. Dit is een voorbeeld van:",
o:["Absolute contra-indicatie: niets masseren","Relatieve plaatselijke contra-indicatie: die plek niet, rest wel","Relatieve algemene contra-indicatie: aanpassen dosering","Geen contra-indicatie: voorzichtig masseren"], a:1,
src:"Hfst. 43, p. Relatieve plaatselijke contra-indicaties",
exp:"Spataderen = relatieve plaatselijke contra-indicatie. Die specifieke plek niet masseren, de rest van het lichaam wel."},

// ══ EHBO & REANIMATIE ═══════════════════════════════════════
{ch:"ehbo", wp:"Hfst. 29 / 45 – EHBO",
q:"Wat is de juiste verhouding borstcompressies en beademingen bij reanimatie van een volwassene?",
o:["15 compressies : 2 beademingen","30 compressies : 2 beademingen","20 compressies : 1 beademing","10 compressies : 2 beademingen"], a:1,
src:"Hfst. 29 / 45, p. Reanimatie",
exp:"Basisreanimatie volwassene: 30 borstcompressies : 2 beademingen. Herhalen tot professionele hulp arriveert."},

{ch:"ehbo", wp:"Hfst. 29 – EHBO",
q:"Een sporter valt bewusteloos maar ademt normaal. Wat is de correcte actie?",
o:["Direct starten met 30 borstcompressies","Stabiele zijligging + 112 bellen","Water geven en wachten tot hij bijkomt","Niets doen, bewaking afwachten"], a:1,
src:"Hfst. 29, p. Bewusteloosheid",
exp:"Bewusteloos + normaal ademend: stabiele zijligging (luchtweg vrijhouden) + 112 inschakelen. Hoofd voorzichtig achterover voor vrije luchtweg."},

{ch:"ehbo", wp:"Hfst. 29 – Hersenletsel",
q:"Twee voetballers botsen met hun hoofden. Eén wordt progressief sufferder. Wanneer schakel je de arts in?",
o:["Na minimaal 10 minuten bewusteloosheid","Meteen: toenemende sufheid na hoofdletsel is een alarmsignaal voor hersenbloeding","Alleen als hij gaat braken","Pas als hij zelf om hulp vraagt"], a:1,
src:"Hfst. 29, p. Hersenbloeding",
exp:"Toenemende sufheid na hoofdletsel = mogelijke hersenbloeding. METEEN arts/112. Dit kan op een verhoogde druk op de hersenen wijzen."},

{ch:"ehbo", wp:"Hfst. 29 – EHBO",
q:"Welke verschijnselen horen bij een hersenschudding? (meerdere antwoorden)",
o:["Misselijkheid en braakneiging","Retrograde amnesie (geheugenverlies voor het moment)","Tijdelijke bewusteloosheid","Hoge koorts (>38°C)"],
type:"multi", a:[0,1,2],
src:"Hfst. 29, p. Hersenschudding",
exp:"Hersenschudding: misselijkheid, braakneiging, hoofdpijn, retrograde amnesie, tijdelijke bewusteloosheid, desoriëntatie. Hoge koorts is geen typisch kenmerk."},

{ch:"ehbo", wp:"Hfst. 29 – EHBO",
q:"Correcte volgorde van de stabiele zijligging:",
o:["Benen omhoogtillen → armen kruisen → draaien → hoofd achterover","Dichtstbijzijnde arm wijd neer → andere arm over borst → ver been optrekken → draaien → hoofd achterover","Hoofd achterover → armen naast lichaam → benen heffen → draaien","Been optillen → mond openen → armen kruisen → draaien"], a:1,
src:"Hfst. 29, p. Stabiele zijligging",
exp:"(1) Dichtstbijzijnde arm wijd neer (handpalm omhoog), (2) andere arm over borst handrug tegen wang, (3) ver been optrekken, (4) draaien naar zijligging, (5) hoofd achterover voor vrije luchtweg."},

{ch:"ehbo", wp:"Hfst. 29 – EHBO",
q:"Schijndood mag alleen worden vastgesteld door:",
o:["Twee gecertificeerde BHV-ers samen","Een sportmasseur met reanimatiecertificaat","Een (schouw)arts of huisarts","De ambulancemedewerker ter plaatse"], a:2,
src:"Hfst. 29, p. Schijndood",
exp:"Dood en schijndood mag alleen door een (schouw)arts of huisarts worden vastgesteld. Enige uitzondering: hoofd van romp gescheiden met minstens bankpas-dikte."},

{ch:"ehbo", wp:"Hfst. 44 – Hygiëne",
q:"Wat is de correcte volgorde bij het handen wassen voor of na een behandeling?",
o:["Zeep aanbrengen → handen nat maken → wrijven → afspoelen","Handen nat maken → zeep aanbrengen → 15-30s wrijven (ook tussen vingers) → afspoelen → drogen","Drogen → handen nat → zeep → wrijven","Handen nat → direct afspoelen → zeep → opnieuw afspoelen"], a:1,
src:"Hfst. 44, p. Hygiëne",
exp:"(1) Nat maken (2) Zeep (3) Minimaal 15-30 seconden grondig wrijven, ook tussen de vingers (4) Afspoelen (5) Drogen met schone handdoek."},

{ch:"ehbo", wp:"Hfst. 29 – EHBO",
q:"Een bewusteloos slachtoffer heeft een rood hoofd. Hoe positioneer je hem?",
o:["Hoofd lager dan de benen (anti-shockpositie)","Hoofd hoger dan de romp","Plat op de rug zonder kussens","In half-zittende houding (30°)"], a:1,
src:"Hfst. 29, p. Bewusteloosheid kleurcodering",
exp:"Rood hoofd = hoofd hoger dan romp. Wit hoofd = hoofd lager dan benen. Blauw hoofd = half-zittende houding."},

// ══ BLESSURES & VERZORGING ══════════════════════════════════
{ch:"blessure", wp:"Hfst. 36 – Verstuiking",
q:"Een sporter verstuikt zijn enkel op het veld. Uit welke stappen bestaat de eerste hulp?",
o:["Direct warm inpakken + direct lopen om de circulatie te stimuleren","Koelen 10-15 min + drukverband met watten + rust + hoog leggen","Masseren voor doorbloeding + stretchoefeningen","Tapen en wedstrijd hervatten na 10 minuten rust"], a:1,
src:"Hfst. 36, p. Verstuiking / Koelen",
exp:"Eerste hulp distorsie: koelen 10-15 minuten (nooit rechtstreeks op huid!) + drukverband met watten + rust + hoog leggen + arts raadplegen."},

{ch:"blessure", wp:"Hfst. 36 – Koelen",
q:"Hoe lang koel je een geblesseerd lichaamsdeel optimaal?",
o:["2-5 minuten","10-15 minuten","30-45 minuten","1-2 uur"], a:1,
src:"Hfst. 36, p. Koelen",
exp:"10-15 minuten. Te kort = geen vaatvernauwing. Te lang (45 min) = als reactie juist vaatverwijding (vasodilatatie)."},

{ch:"blessure", wp:"Hfst. 37 – Sportongevallen",
q:"Bij palpatie van de knie wordt vocht gevoeld en de knie is dik. Hoe noemen we vochtophoping in het gewricht?",
o:["Bursitis","Hydrops","Myogelose","Tendinitis"], a:1,
src:"Hfst. 37, p. Hydrops",
exp:"Hydrops = vochtophoping in het gewricht. Een knie met veel hydrops herstelt 3× zo langzaam. Rust noodzakelijk zolang er vocht aanwezig is."},

{ch:"blessure", wp:"Hfst. 37 – Sportongevallen",
q:"Een sporter heeft zwelling en drukpijn op zijn elleboog door herhaalde vallen als keeper. De bursa op het olecranon is aangedaan. Dit heet:",
o:["Tennis-elleboog (epicondylitis lateralis)","Bursitis olecrani (studentenelleboog)","Osgood-Schlatter aandoening","Golf-elleboog (epicondylitis medialis)"], a:1,
src:"Hfst. 37, p. Bursitis olecrani",
exp:"Bursitis olecrani = slijmbeursontsteking op het olecranon (elleboogpunt). Veroorzaakt door herhaald vallen op de elleboog. Soms 'studentenelleboog' genoemd."},

{ch:"blessure", wp:"Hfst. 37 – Sportongevallen",
q:"Een tennisser heeft pijn aan de buitenzijde van de elleboog. Dit is:",
o:["Epicondylitis medialis (golf-elleboog)","Epicondylitis lateralis (tennis-elleboog)","Bursitis olecrani","Avulsiefractuur epicondylus medialis"], a:1,
src:"Hfst. 37, p. Tennis-elleboog",
exp:"Tennis-elleboog = epicondylitis lateralis (buitenzijde). Golf-elleboog = epicondylitis medialis (binnenzijde). Door overbelasting van de extensoren resp. flexoren."},

{ch:"blessure", wp:"Hfst. 36 – Distorsie gradaties",
q:"Een sporter heeft een 3e graads enkeldistorsie. Welke kenmerken zijn kenmerkend?",
o:["Lokale overrekking, eenzijdige zwelling, pijn verdraagbaar","Gedeeltelijke bandscheuring, binnen- en buitenenkel dik, doorlopen niet mogelijk","Volledige afscheuring, knappend geluid, totaal functieverlies, enorme zwelling","Contusie van kapsel, matige zwelling, doorlopen pijnlijk maar mogelijk"], a:2,
src:"Hfst. 36, p. Enkeldistorsie 3e graads",
exp:"3e graads: volledige bandafscheuring, knappend geluid, totaal functieverlies, snelle enorme zwelling. Specialistisch onderzoek + evt. operatie noodzakelijk."},

{ch:"blessure", wp:"Hfst. 36 – Krampbestrijding",
q:"Een sporter krijgt kramp in de hamstrings. Welke drie methoden zijn er (van mild naar intensief)?",
o:["Ijsapplicatie, massage, stretchen","Schudmethode, antagonisten-methode, rekmethode","Warmtecompres, massage, mobilisatie","Compressie, elevatie, mobilisatie"], a:1,
src:"Hfst. 36, p. Krampbestrijding",
exp:"Drie methoden (mild → intensief): (1) schudmethode, (2) antagonisten-methode (antagonist aanspannen onder weerstand), (3) rekmethode (spier in maximale rek brengen)."},

{ch:"blessure", wp:"Hfst. 36 – Luxatie",
q:"Een sporter heeft zijn schouder 'uit de kom'. Dit is een luxatie. Wat zijn de kenmerken?",
o:["Pijn + zwelling + bloeding + normaal bewegen","Abnormale stand + lege gewrichtskom + functieverlies + eventueel verende weerstand","Knapgeluid + spierwal + ontvelling","Blauwe plek + lokale zwelling + normaal bewegen"], a:1,
src:"Hfst. 36, p. Luxatie",
exp:"Luxatie (ontwrichting): abnormale stand, lege gewrichtskom, functieverlies, pijn, zwelling, eventueel verende weerstand. Nooit zelf terugplaatsen."},

{ch:"blessure", wp:"Hfst. 36 – Osgood-Schlatter",
q:"Een 13-jarige voetballer heeft pijn net onder de knieschijf bij het sporten. De tuberositas tibiae is gevoelig. Wat is dit?",
o:["Patellaluxatie","Meniscusletsel","Aandoening van Osgood-Schlatter","Bursitis suprapatellaris"], a:2,
src:"Hfst. 36, p. Osgood-Schlatter",
exp:"Osgood-Schlatter: overbelasting van de kniepees-aanhechting op de tuberositas tibiae bij groeiende kinderen (10-16 jaar). Rust + belastingsvermindering is de behandeling."},

// ══ TAPEN & BANDAGEREN ══════════════════════════════════════
{ch:"tapen", wp:"Hfst. 40 – Tapen",
q:"Stijgbeugels (stirrups) zijn een specifieke tapetechniek. Bij welk gewricht worden ze gebruikt?",
o:["Kniegewricht","Schoudergewricht","Enkelgewricht","Polsgewricht"], a:2,
src:"Hfst. 40, p. Enkeltaping",
exp:"Stijgbeugels = U-vormige tapestroken bij enkeltaping. Van binnenzijde onderbeen onder het hielbeen naar de buitenzijde. Ondersteunen de laterale enkelbanden."},

{ch:"tapen", wp:"Hfst. 36 – Distorsie behandeling",
q:"Een sporter heeft een 2e graads enkeldistorsie. Wanneer mag er getaped worden?",
o:["Onmiddellijk na het letsel","Na ca. 3 dagen (na koelen en drukverband fase)","Na 4 weken wanneer volledig pijnvrij","Alleen na chirurgische ingreep"], a:1,
src:"Hfst. 36, p. Enkeldistorsie 2e graads",
exp:"2e graads: eerst koelen + drukverband. Na ca. 3 dagen tapebandage. Na ca. 4 weken hervatten sporten met preventieve bandage."},

{ch:"tapen", wp:"Hfst. 36 – Osgood-Schlatter",
q:"Een circulaire tapestrook net onder de knieschijf geeft tijdelijke klachtenvermindering bij welke aandoening?",
o:["Tennis-elleboog","Bursitis suprapatellaris","Osgood-Schlatter","Achillespeesontsteking"], a:2,
src:"Hfst. 36, p. Osgood-Schlatter",
exp:"Een circulaire tapestrook net onder de knieschijf verlicht de spanning op de kniepees-aanhechting bij Osgood-Schlatter."},

{ch:"tapen", wp:"Hfst. 40 – Tapen",
q:"Wat is het doel van tapen bij een enkeldistorsie? (meerdere antwoorden)",
o:["Stabilisatie van het gewricht","Bescherming van de aangedane banden","Versnelling van de bloedcirculatie door druk","Beperking van abnormale bewegingen"],
type:"multi", a:[0,1,3],
src:"Hfst. 40, p. Tapen",
exp:"Tapen: stabilisatie + bescherming van banden + beperking abnormale bewegingen. Tapen versnelt NIET de bloedcirculatie."},

// ══ FYSIOLOGIE & TRAINING ═══════════════════════════════════
{ch:"fysio", wp:"Hfst. 24 – Inspanningsfysiologie",
q:"Na een training herstelt het lichaam en stijgt het prestatieniveau boven het beginpunt. Hoe noemen we dit?",
o:["Reversibiliteit","Supercompensatie","Specificiteit","Overload"], a:1,
src:"Hfst. 24, p. Supercompensatie",
exp:"Supercompensatie: belastingfase → compensatiefase (herstel) → overcompensatiefase (niveau hoger dan voor training)."},

{ch:"fysio", wp:"Hfst. 24 – Inspanningsfysiologie",
q:"Als een sporter stopt met trainen gaan de trainingseffecten verloren. Welk principe is dit?",
o:["Specificiteit","Supercompensatie","Reversibiliteit","Overload"], a:2,
src:"Hfst. 24, p. Reversibiliteit",
exp:"Reversibiliteit = omkeerbaarheid: trainingseffecten verdwijnen net zo snel als opgebouwd. Uithoudingsvermogen neemt het snelst af."},

{ch:"fysio", wp:"Hfst. 24 – Inspanningsfysiologie",
q:"Een marathonloper traint veel aeroob. Zijn sprintvermogen verbetert nauwelijks. Welk trainingsprincipe verklaart dit?",
o:["Reversibiliteit","Overload","Supercompensatie","Specificiteit"], a:3,
src:"Hfst. 24, p. Specificiteit",
exp:"Specificiteit: het lichaam past zich aan in de richting van de belasting. Duurtraining verbetert VO2-max, niet explosieve snelkracht."},

{ch:"fysio", wp:"Hfst. 24 – Energiesystemen",
q:"Een sprinter gebruikt het anaerobe systeem. Wat is het verschil met het aerobe systeem?",
o:["Aeroob = korte explosieve inspanning zonder zuurstof; anaeroob = met zuurstof voor duur","Aeroob = met zuurstof voor langdurige inspanning; anaeroob = zonder zuurstof voor kort explosief","Aeroob = krachtsport; anaeroob = duursport","Beide systemen produceren evenveel melkzuur"], a:1,
src:"Hfst. 24, p. Energiesystemen",
exp:"Aeroob = met zuurstof, voor langdurige inspanning. Anaeroob = zonder zuurstof, voor korte explosieve inspanning. Anaeroob produceert melkzuur als bijproduct."},

{ch:"fysio", wp:"Hfst. 24 – Supercompensatie",
q:"De supercompensatiecyclus bestaat uit drie fasen. Welke zijn dat? (meerdere antwoorden)",
o:["Belastingfase","Compensatiefase (herstel)","Voedingsfase","Overcompensatiefase (prestatieniveau stijgt)"],
type:"multi", a:[0,1,3],
src:"Hfst. 24, p. Supercompensatie",
exp:"De drie fasen: (1) belastingfase, (2) compensatiefase (herstel), (3) overcompensatiefase (prestatieniveau hoger dan uitgangswaarde)."},

{ch:"fysio", wp:"Hfst. 36 – Spierkramp",
q:"Welke factoren kunnen spierkramp veroorzaken? (meerdere antwoorden)",
o:["Vermoeidheid","Onvoldoende warming-up","Ruim voldoende vochtinname","Tekort aan zouten bij overmatig zweten"],
type:"multi", a:[0,1,3],
src:"Hfst. 36, p. Spierkramp",
exp:"Oorzaken kramp: vermoeidheid, onvoldoende warming-up, hoge spierspanning, koude, tekort aan zouten/vocht. Voldoende drinken is preventie, niet een oorzaak."},

// ══ HUID & HYGIËNE ══════════════════════════════════════════
{ch:"huid", wp:"Hfst. 18 – De huid",
q:"Waar wordt melaninepigment gevormd in de huid?",
o:["In de lederhuid (dermis)","In de epidermis (opperhuid), in de pigmentkorrels van de cellen","In de subcutis (onderhuid)","In de talgklieren van de dermis"], a:1,
src:"Hfst. 18, p. Opperhuid",
exp:"Melanine wordt gevormd in de cellen van de epidermis. UV-straling stimuleert meer aanmaak. Het beschermt het onderliggend weefsel."},

{ch:"huid", wp:"Hfst. 18 – De huid",
q:"De huid bestaat uit twee hoofdlagen. Welke structuren bevinden zich in de lederhuid (dermis)? (meerdere antwoorden)",
o:["Haarvaten","Talgklieren","Stratum corneum (hoornlaag)","Receptoren voor pijn, tast en temperatuur"],
type:"multi", a:[0,1,3],
src:"Hfst. 18, p. Lederhuid",
exp:"Lederhuid: haarvaten, zenuwtakjes, haarspieren, talgklieren en receptoren. Stratum corneum bevindt zich in de epidermis."},

{ch:"huid", wp:"Hfst. 18 – De huid",
q:"Na een massage ziet de huid rood en voelt warm aan. Een sporter vraagt waarom. Wat verklaar je?",
o:["Dit is een allergische reactie op de massageolie","Dit is hyperemie: verhoogde arteriële en capillaire doorbloeding door massage","Dit is cyanose door zuurstoftekort in de huid","Dit is oedeem door vochtophoping in de dermis"], a:1,
src:"Hfst. 18 / Hfst. 43, p. Hyperemie",
exp:"Hyperemie = verbeterde bloedtoevoer, zichtbaar als roodheid en warmte. Normale reactie op massage."},

{ch:"huid", wp:"Hfst. 44 – Sporthygiëne",
q:"Een cliënt heeft een schimmelinfectie op de voet. Schimmels zijn besmettelijk. Hoe handel je?",
o:["Gewoon masseren met extra lotion","Grondig handen wassen voor en na behandeling; schimmels verspreiden via huidschilfertjes","Direct doorverwijzen, je mag niet behandelen","Alleen met handschoenen masseren is voldoende"], a:1,
src:"Hfst. 44, p. Schimmelnagel",
exp:"Schimmels zijn besmettelijk via huidschilfertjes. Altijd grondig handen wassen voor en na behandeling. Alert blijven met hygiëne."},

{ch:"huid", wp:"Hfst. 18 – De huid",
q:"Welke functies heeft de huid? (meerdere antwoorden)",
o:["Bescherming tegen uitdroging (talgklieren)","Temperatuurregeling (zweet, doorbloeding)","Pigmentvorming als bescherming tegen UV-straling","Bloedvorming (hematopoëse)"],
type:"multi", a:[0,1,2],
src:"Hfst. 18, p. Functies huid",
exp:"De huid: beschermt tegen uitdroging, regelt temperatuur, vormt pigment. Bloedvorming vindt in het rode beenmerg plaats (o.a. in het sternum)."},

// ══ CLIËNTDOSSIER & REGELS ══════════════════════════════════
{ch:"dossier", wp:"WP2 – AVG / NGS",
q:"Welke gegevens mogen in het cliëntendossier worden opgenomen?",
o:["Niets: de AVG verbiedt opslag van gezondheidsgegevens","Alleen anonieme behandelverslagen","Persoonsgegevens, anamnesegegevens, behandelplannen en verslagen","Uitsluitend gegevens die de cliënt zelf schriftelijk aanlevert"], a:2,
src:"WP2, p. Dossier / AVG",
exp:"In het dossier: persoonsgegevens + anamnesegegevens + behandelplannen + verslagen. Dit is geregeld via de AVG."},

{ch:"dossier", wp:"WP2 – AVG / NGS",
q:"Welke rechten heeft een cliënt op basis van de AVG ten aanzien van zijn dossier?",
o:["De masseur is eigenaar; de cliënt heeft geen wettelijke rechten","Recht op inzage, correctie en verwijdering van zijn persoonsgegevens","Alleen inzagerecht na schriftelijk verzoek","Rechten vervallen na 5 jaar bewaring"], a:1,
src:"WP2, p. AVG cliëntrechten",

{ch:"dossier", wp:"WP2 – NGS / NBSM",

// ══════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════
let mode = 20;
let selectedChs = new Set(CHAPTERS.map(c => c.id)); // all on by default
let questions = [];
let cur = 0, score = 0, streak = 0;
let answered = false;
let multiSel = [];
let stats = {}; // persistent per-question performance

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
function init() {
  loadStats();
  buildChapterGrid();
  updateSelAllBtn();
}

function loadStats() {
  try { const s = localStorage.getItem('ngs_v3'); if (s) stats = JSON.parse(s); } catch(e) {}
}
function saveStats() {
  try { localStorage.setItem('ngs_v3', JSON.stringify(stats)); } catch(e) {}
}

function buildChapterGrid() {
  const grid = document.getElementById('chapGrid');
  grid.innerHTML = '';
  CHAPTERS.forEach(ch => {
    const count = DB.filter(q => q.ch === ch.id).length;
    const s = getChapterStats(ch.id);
    const pct = s.total > 0 ? Math.round(s.right / s.total * 100) : null;
    const pctTxt = pct !== null ? ` · ${pct}% ✓` : '';
    const btn = document.createElement('button');
    btn.className = 'ch-btn on';
    btn.id = 'ch_' + ch.id;
    btn.innerHTML = `<div class="ch-check">✓</div>
      <div class="ch-meta">
        <div class="ch-name">${ch.icon} ${ch.name}</div>
        <div class="ch-count">${count} vragen${pctTxt}</div>
      </div>`;
    btn.onclick = () => toggleChapter(ch.id, btn);
    grid.appendChild(btn);
  });
}

function getChapterStats(chId) {
  let right = 0, total = 0;
  DB.forEach((q, i) => {
    if (q.ch !== chId) return;
    if (stats[i]) { right += stats[i].r; total += stats[i].r + stats[i].w; }
  });
  return { right, total };
}

function toggleChapter(id, btn) {
  if (selectedChs.has(id)) { selectedChs.delete(id); btn.classList.remove('on'); }
  else { selectedChs.add(id); btn.classList.add('on'); }
  updateSelAllBtn();
}

function toggleAll() {
  if (selectedChs.size === CHAPTERS.length) {
    selectedChs.clear();
    document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('on'));
  } else {
    CHAPTERS.forEach(c => selectedChs.add(c.id));
    document.querySelectorAll('.ch-btn').forEach(b => b.classList.add('on'));
  }
  updateSelAllBtn();
}

function updateSelAllBtn() {
  document.getElementById('selAllBtn').textContent =
    selectedChs.size === CHAPTERS.length ? 'Alles deselecteren' : 'Alles selecteren';
}

function setMode(n) {
  mode = n;
  ['m20','m40','mMax'].forEach(id => document.getElementById(id).classList.remove('on'));
  document.getElementById(n === 20 ? 'm20' : n === 40 ? 'm40' : 'mMax').classList.add('on');
}

// ══════════════════════════════════════════════════════════════
// WEIGHTED SHUFFLE — slechte vragen komen vaker terug
// ══════════════════════════════════════════════════════════════
function getWeight(idx) {
  const s = stats[idx];
  if (!s || s.r + s.w === 0) return 3;
  const rate = s.r / (s.r + s.w);
  if (rate < 0.4) return 6;
  if (rate < 0.7) return 3;
  return 1;
}

function buildQuestionPool() {
  const pool = DB
    .map((q, i) => ({ q, i }))
    .filter(({ q }) => selectedChs.has(q.ch));

  // weighted list
  const weighted = [];
  pool.forEach(({ q, i }) => {
    const w = getWeight(i);
    for (let j = 0; j < w; j++) weighted.push(i);
  });

  // shuffle, deduplicate
  weighted.sort(() => Math.random() - .5);
  const seen = new Set(), result = [];
  const limit = mode >= 9999 ? pool.length : Math.min(mode, pool.length);
  for (const idx of weighted) {
    if (!seen.has(idx)) { seen.add(idx); result.push(DB[idx]); }
    if (result.length >= limit) break;
  }
  // fill up if not enough unique
  if (result.length < limit) {
    pool.forEach(({ q }) => { if (!result.includes(q)) result.push(q); });
  }
  return result.slice(0, limit);
}

// ══════════════════════════════════════════════════════════════
// EXAM FLOW
// ══════════════════════════════════════════════════════════════
function startExam() {
  if (selectedChs.size === 0) {
    document.getElementById('startWarn').style.display = 'block'; return;
  }
  document.getElementById('startWarn').style.display = 'none';
  questions = buildQuestionPool();
  cur = 0; score = 0; streak = 0;
  show('scQuiz'); hide('scStart');
  showQ();
}

function showQ() {
  answered = false; multiSel = [];
  const q = questions[cur];
  const isMulti = q.type === 'multi';

  document.getElementById('qTag').textContent = q.wp;
  document.getElementById('qNr').textContent = `Vraag ${cur + 1} van ${questions.length}`;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('multiHint').style.display = isMulti ? 'inline-block' : 'none';
  document.getElementById('submitBtn').style.display = isMulti ? 'block' : 'none';
  hide('fb'); hide('nextBtn');

  // shuffle options
  const opts = q.o.map((text, orig) => ({ text, orig })).sort(() => Math.random() - .5);
  const c = document.getElementById('opts');
  c.innerHTML = '';
  opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="ltr">${String.fromCharCode(65 + i)}</span><span>${opt.text}</span>`;
    btn.dataset.orig = opt.orig;
    btn.onclick = isMulti ? () => toggleMulti(btn, opt.orig) : () => singleAnswer(btn, opt.orig);
    c.appendChild(btn);
  });
  updateHeader();
}

function toggleMulti(btn, orig) {
  if (answered) return;
  if (multiSel.includes(orig)) {
    multiSel = multiSel.filter(x => x !== orig);
    btn.classList.remove('sel');
  } else {
    multiSel.push(orig);
    btn.classList.add('sel');
  }
}

function submitMulti() {
  if (answered || multiSel.length === 0) return;
  answered = true;
  const q = questions[cur];
  const ok = JSON.stringify(q.a.slice().sort()) === JSON.stringify(multiSel.slice().sort());
  revealOptions(q);
  finishAnswer(ok, q);
}

function singleAnswer(btn, chosen) {
  if (answered) return;
  answered = true;
  const q = questions[cur];
  const ok = chosen === q.a;
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (parseInt(b.dataset.orig) === q.a) b.classList.add('ok');
  });
  if (!ok) btn.classList.add('ko');
  finishAnswer(ok, q);
}

function revealOptions(q) {
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    const orig = parseInt(b.dataset.orig);
    const shouldBeOk = Array.isArray(q.a) ? q.a.includes(orig) : orig === q.a;
    if (shouldBeOk) b.classList.add('ok');
    else if (multiSel.includes(orig)) b.classList.add('ko');
  });
}

function finishAnswer(ok, q) {
  const idx = DB.indexOf(q);
  if (idx >= 0) {
    if (!stats[idx]) stats[idx] = { r: 0, w: 0 };
    ok ? stats[idx].r++ : stats[idx].w++;
    saveStats();
  }
  if (ok) { score++; streak++; } else { streak = 0; }

  const fb = document.getElementById('fb');
  fb.style.display = 'block';
  fb.className = 'feedback ' + (ok ? 'ok' : 'ko');
  document.getElementById('fbTitle').textContent = ok ? '✅ Correct!' : '❌ Niet correct';
  document.getElementById('fbText').textContent = q.exp;
  document.getElementById('fbSrc').textContent = '📖 Bron: ' + q.src;

  document.getElementById('submitBtn').style.display = 'none';
  const nb = document.getElementById('nextBtn');
  nb.style.display = 'block';
  nb.textContent = cur + 1 < questions.length ? 'Volgende →' : 'Bekijk resultaat →';
  updateHeader();
}

function nextQ() {
  cur++;
  if (cur >= questions.length) showResult();
  else showQ();
}

function updateHeader() {
  document.getElementById('pb').style.width = (cur / questions.length * 100) + '%';
  document.getElementById('hVoortgang').textContent = `${cur + 1} / ${questions.length}`;
  document.getElementById('hScore').textContent = `✓ ${score}`;
  document.getElementById('hStreak').textContent = `🔥 ${streak}`;
}

// ══════════════════════════════════════════════════════════════
// RESULT
// ══════════════════════════════════════════════════════════════
function showResult() {
  hide('scQuiz'); show('scResult');
  document.getElementById('pb').style.width = '100%';
  const pct = Math.round(score / questions.length * 100);
  document.getElementById('rPct').textContent = pct + '%';
  let emoji, label;
  if (pct >= 85) { emoji = '🏆'; label = 'Uitstekend! Je bent klaar voor het echte examen!'; }
  else if (pct >= 70) { emoji = '🎯'; label = 'Goed bezig! Herhaal de oranje/rode categorieën.'; }
  else if (pct >= 55) { emoji = '📚'; label = 'Redelijk — meer herhaling nodig.'; }
  else { emoji = '💪'; label = 'Niet opgeven! Bestudeer het boek en probeer opnieuw.'; }
  document.getElementById('rEmoji').textContent = emoji;
  document.getElementById('rLabel').textContent = label;
  document.getElementById('rGoed').textContent = `✓ ${score} goed`;
  document.getElementById('rFout').textContent = `✗ ${questions.length - score} fout`;

  // category breakdown — all-time stats
  const catMap = {};
  CHAPTERS.forEach(ch => catMap[ch.id] = { name: ch.name, icon: ch.icon, r: 0, t: 0 });
  DB.forEach((q, i) => {
    if (!stats[i] || !catMap[q.ch]) return;
    catMap[q.ch].r += stats[i].r;
    catMap[q.ch].t += stats[i].r + stats[i].w;
  });

  const cats = document.getElementById('rCats');
  cats.innerHTML = '<div class="r-cats-title">Resultaat per categorie (alle sessies):</div>';
  Object.values(catMap)
    .filter(d => d.t > 0)
    .sort((a, b) => (a.r / a.t) - (b.r / b.t))
    .forEach(d => {
      const p = Math.round(d.r / d.t * 100);
      const col = p >= 70 ? '#22c55e' : p >= 50 ? '#f59e0b' : '#ef4444';
      const badge = p < 60 ? '<span class="cbadge">⚠️ herhalen</span>' : '';
      const div = document.createElement('div');
      div.className = 'crow';
      div.innerHTML = `<span class="cname">${d.icon} ${d.name}${badge}</span>
        <span class="cscore">${d.r}/${d.t}</span>
        <div class="cbar"><div class="cfill" style="width:${p}%;background:${col}"></div></div>`;
      cats.appendChild(div);
    });
}

function restart() { hide('scResult'); startExam(); }
function goHome() {
  hide('scResult'); show('scStart');
  buildChapterGrid(); // refresh stats in chapter grid
}

function show(id) { document.getElementById(id).style.display = 'block'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }

// START
init();
</script>
